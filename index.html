<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Author Directory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #22201B;
    --ink-soft: #5B584F;
    --paper: #FAF8F3;
    --paper-raised: #FFFFFF;
    --line: #E4DFD3;
    --accent: #2F6F62;
    --accent-dark: #1F4E44;
    --gold: #C08A2E;
    --tag-bg: #EFEAE0;
    --tag-text: #4A473E;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #EDEAE1;
      --ink-soft: #B7B3A6;
      --paper: #17160F;
      --paper-raised: #201F16;
      --line: #34321F;
      --accent: #4F9C89;
      --accent-dark: #6FBBA7;
      --gold: #D9A94A;
      --tag-bg: #262418;
      --tag-text: #C9C4B4;
    }
  }
  :root[data-theme="dark"] {
    --ink: #EDEAE1;
    --ink-soft: #B7B3A6;
    --paper: #17160F;
    --paper-raised: #201F16;
    --line: #34321F;
    --accent: #4F9C89;
    --accent-dark: #6FBBA7;
    --gold: #D9A94A;
    --tag-bg: #262418;
    --tag-text: #C9C4B4;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }

  header h1 {
    font-family: 'Source Serif 4', serif;
    font-weight: 700;
    font-size: 2.1rem;
    margin: 0 0 .25rem;
    letter-spacing: -0.01em;
  }
  header p { margin: 0 0 1.75rem; color: var(--ink-soft); font-size: .95rem; }

  .tabs { display: flex; gap: 1.75rem; border-bottom: 1px solid var(--line); margin-bottom: 1.25rem; }
  .tab {
    background: none; border: none; cursor: pointer;
    font-family: 'Inter', sans-serif; font-size: .95rem; font-weight: 600;
    color: var(--ink-soft); padding: 0 0 .7rem; position: relative;
  }
  .tab.active { color: var(--ink); }
  .tab.active::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--accent);
  }

  .toolbar { display: flex; gap: .6rem; margin-bottom: 1.5rem; }
  .search {
    flex: 1; padding: .6rem .85rem; border: 1px solid var(--line); border-radius: 6px;
    background: var(--paper-raised); color: var(--ink); font-family: 'Inter', sans-serif; font-size: .9rem;
  }
  .search:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .add-btn {
    padding: .6rem 1rem; border-radius: 6px; border: 1px solid var(--accent);
    background: var(--accent); color: #fff; font-weight: 600; font-size: .85rem; cursor: pointer;
    font-family: 'Inter', sans-serif; white-space: nowrap;
  }
  .add-btn:hover { background: var(--accent-dark); border-color: var(--accent-dark); }

  .panel { display: none; }
  .panel.active { display: block; }

  .row {
    display: flex; align-items: flex-start; gap: 1rem;
    padding: 1.1rem 0; border-bottom: 1px solid var(--line);
  }
  .avatar {
    width: 56px; height: 56px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Source Serif 4', serif; font-weight: 600; font-size: 1.15rem; color: #fff;
  }
  .cover {
    width: 48px; height: 68px; border-radius: 3px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; text-align: center;
    font-family: 'Source Serif 4', serif; font-weight: 600; font-size: .65rem; color: #fff; padding: 4px;
    line-height: 1.15;
  }
  .info { flex: 1; min-width: 0; }
  .name-line { display: flex; align-items: center; gap: .35rem; flex-wrap: wrap; }
  .name-link { background: none; border: none; padding: 0; font: inherit; cursor: pointer; }
  .name { font-family: 'Source Serif 4', serif; font-weight: 600; font-size: 1.05rem; }
  .name-link .name { text-decoration: none; }
  .name-link:hover .name { color: var(--accent); text-decoration: underline; }
  .badge { color: var(--accent); font-size: .95rem; }
  .meta { color: var(--ink-soft); font-size: .85rem; margin-top: .15rem; }
  .meta .count { color: var(--gold); font-weight: 600; }
  .tags { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .5rem; }
  .tag {
    background: var(--tag-bg); color: var(--tag-text); font-size: .75rem;
    padding: .2rem .55rem; border-radius: 4px;
  }
  .side { display: flex; flex-direction: column; align-items: flex-end; gap: .4rem; flex-shrink: 0; }
  .add-book-btn {
    padding: .4rem .9rem; border-radius: 5px; border: 1px solid var(--line);
    background: transparent; color: var(--accent); font-size: .8rem; font-weight: 600; cursor: pointer;
    font-family: 'Inter', sans-serif; min-width: 84px; white-space: nowrap;
  }
  .add-book-btn:hover { background: var(--tag-bg); }

  .edit-btn {
    padding: .35rem .8rem; border-radius: 5px; border: 1px solid var(--line);
    background: transparent; color: var(--ink-soft); font-size: .78rem; font-weight: 600; cursor: pointer;
    font-family: 'Inter', sans-serif; white-space: nowrap; flex-shrink: 0; align-self: flex-start;
  }
  .edit-btn:hover { background: var(--tag-bg); color: var(--ink); }

  .book-list { list-style: none; margin: .55rem 0 0; padding: 0; display: flex; flex-direction: column; gap: .25rem; }
  .book-list li::before { content: "\2022"; color: var(--gold); margin-right: .45rem; }
  .book-link {
    background: none; border: none; padding: 0; cursor: pointer; text-align: left;
    font-family: 'Inter', sans-serif; font-size: .85rem; color: var(--ink);
  }
  .book-link:hover { color: var(--accent); text-decoration: underline; }

  .row.highlight { background: var(--tag-bg); border-radius: 6px; }

  .export-btn {
    padding: .6rem 1rem; border-radius: 6px; border: 1px solid var(--line);
    background: transparent; color: var(--ink); font-weight: 600; font-size: .85rem; cursor: pointer;
    font-family: 'Inter', sans-serif; white-space: nowrap;
  }
  .export-btn:hover { background: var(--tag-bg); }
  .export-btn[hidden] { display: none; }
  .export-note { font-size: .8rem; color: var(--ink-soft); min-height: 1.1rem; margin: -.75rem 0 1rem; }

  .expired { color: #B3402A; font-weight: 600; }

  .filter-bar {
    display: flex; align-items: center; justify-content: space-between; gap: .75rem;
    padding: .6rem .85rem; margin-bottom: .5rem; border: 1px solid var(--line); border-radius: 6px;
    background: var(--paper-raised); font-size: .85rem; color: var(--ink-soft);
  }
  .filter-bar strong { color: var(--ink); }
  .filter-bar button {
    background: none; border: none; cursor: pointer; color: var(--accent); font-weight: 600;
    font-family: 'Inter', sans-serif; font-size: .82rem; white-space: nowrap;
  }
  .filter-bar button:hover { text-decoration: underline; }

  .empty { color: var(--ink-soft); font-size: .9rem; padding: 2rem 0; text-align: center; }

  .form-card {
    display: none; background: var(--paper-raised); border: 1px solid var(--line); border-radius: 8px;
    padding: 1.1rem; margin-bottom: 1.5rem;
  }
  .form-card.open { display: block; }
  .form-card h3 { margin: 0 0 .8rem; font-family: 'Source Serif 4', serif; font-size: 1.05rem; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; margin-bottom: .6rem; }
  .form-grid .full { grid-column: 1 / -1; }
  .form-card input, .form-card select {
    width: 100%; padding: .5rem .65rem; border: 1px solid var(--line); border-radius: 5px;
    background: var(--paper); color: var(--ink); font-family: 'Inter', sans-serif; font-size: .85rem;
  }
  .form-card label { font-size: .75rem; color: var(--ink-soft); display: block; margin-bottom: .2rem; }
  .form-actions { display: flex; gap: .5rem; margin-top: .3rem; }
  .save-btn {
    padding: .5rem 1rem; border-radius: 5px; border: 1px solid var(--accent);
    background: var(--accent); color: #fff; font-weight: 600; font-size: .82rem; cursor: pointer;
  }
  .cancel-btn {
    padding: .5rem 1rem; border-radius: 5px; border: 1px solid var(--line);
    background: transparent; color: var(--ink-soft); font-weight: 600; font-size: .82rem; cursor: pointer;
  }

  @media (max-width: 480px) {
    .form-grid { grid-template-columns: 1fr; }
    .ama { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Author Directory</h1>
    <p>Browse authors and their books, or add your own.</p>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="authors">Authors</button>
    <button class="tab" data-tab="books">Books</button>
  </div>

  <div class="toolbar">
    <input class="search" id="authorSearch" placeholder="Search authors or genres…">
    <button class="export-btn" id="exportAuthors" hidden>Export CSV</button>
    <button class="add-btn" id="authorAddToggle">+ Add author</button>
  </div>

  <div class="export-note" id="exportNote" role="status"></div>

  <div class="form-card" id="authorForm">
    <h3 id="authorFormTitle">Add an author</h3>
    <div class="form-grid">
      <div><label>Name</label><input id="af-name" placeholder="Jane Doe"></div>
      <div><label>Location</label><input id="af-location" placeholder="United States"></div>
      <div><label>Genres (comma separated)</label><input id="af-genres" placeholder="Fantasy, Mystery"></div>
      <div><label>Author website</label><input id="af-website" placeholder="https://example.com"></div>
      <div><label>Phone number</label><input id="af-phone" type="tel" placeholder="+1 555 123 4567"></div>
      <div><label>Do we own the domain?</label><select id="af-domainowned"><option value="">Not set</option><option value="Yes">Yes</option><option value="No">No</option></select></div>
      <div><label>Domain expiry date</label><input id="af-domainexpiry" type="date"></div>
      <div><label>Assigned marketing team</label><input id="af-team" placeholder="e.g. Children's Marketing"></div>
      <div><label>Sales team</label><input id="af-salesteam" placeholder="e.g. Northeast Sales"></div>
      <div><label>Web designer</label><input id="af-webdesigner" placeholder="Name"></div>
      <div class="full"><label>Video editor</label><input id="af-videoeditor" placeholder="Name"></div>
    </div>
    <div class="form-actions">
      <button class="save-btn" id="af-save">Save author</button>
      <button class="cancel-btn" id="af-cancel">Cancel</button>
    </div>
  </div>

  <div class="panel active" id="authorsPanel"></div>

  <div class="panel" id="booksPanel">
    <div class="toolbar">
      <button class="export-btn" id="exportBooks" hidden>Export CSV</button>
      <button class="add-btn" id="bookAddToggle">+ Add book</button>
    </div>
    <div class="form-card" id="bookForm">
      <h3 id="bookFormTitle">Add a book</h3>
      <div class="form-grid">
        <div><label>Title</label><input id="bf-title" placeholder="The Long Voyage"></div>
        <div><label>Author</label><input id="bf-author" placeholder="Jane Doe"></div>
        <div><label>Publish date</label><input id="bf-date" placeholder="Jan 30, 2026"></div>
        <div><label>Series</label><input id="bf-series" placeholder="Optional"></div>
        <div class="full"><label>Genres (comma separated)</label><input id="bf-genres" placeholder="Fantasy, Children's"></div>
        <div><label>ISBN</label><input id="bf-isbn" placeholder="978-0-000000-0-0"></div>
      </div>
      <div class="form-actions">
        <button class="save-btn" id="bf-save">Save book</button>
        <button class="cancel-btn" id="bf-cancel">Cancel</button>
      </div>
    </div>
    <div id="bookFilterBar"></div>
    <div id="booksList"></div>
  </div>
</div>

<script>
(function(){
  var PALETTE = ['#2F6F62','#C08A2E','#8A4B3B','#5B6F9C','#7A6A9C','#3B7A8F'];
  function colorFor(str){
    var h = 0;
    for (var i=0;i<str.length;i++) h = str.charCodeAt(i) + ((h<<5)-h);
    return PALETTE[Math.abs(h) % PALETTE.length];
  }
  function fmtDate(iso){
    var d = new Date(iso + 'T00:00:00');
    if (isNaN(d)) return iso;
    return d.toLocaleDateString('en-US', { month:'short', day:'2-digit', year:'numeric' });
  }
  function domainLine(a){
    var bits = [];
    if (a.domainOwned) bits.push('Domain owned: <strong>' + esc(a.domainOwned) + '</strong>');
    if (a.domainExpiry) {
      var expired = new Date(a.domainExpiry + 'T23:59:59') < new Date();
      bits.push('Expires: ' + esc(fmtDate(a.domainExpiry)) + (expired ? ' <span class="expired">(expired)</span>' : ''));
    }
    return bits.length ? '<div class="meta">' + bits.join(' &middot; ') + '</div>' : '';
  }
  function initials(name){
    return name.split(' ').map(function(w){return w[0]||'';}).join('').slice(0,2).toUpperCase();
  }
  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  var seedAuthors = [
    { name:'Roxie Fiste', location:'United States', genres:['Children\'s'], books:3, website:'', phone:'', domainOwned:'', domainExpiry:'', team:'', salesTeam:'', webDesigner:'', videoEditor:'' },
    { name:'Yevgen Azarenkov', location:'Ukraine', genres:['Mystery','Historical Fiction','Humor','Science Fiction','Fantasy','Teen & Young Adult','Children\'s'], books:6, website:'', phone:'', domainOwned:'', domainExpiry:'', team:'', salesTeam:'', webDesigner:'', videoEditor:'' },
    { name:'Wanda Luthman', location:'United States', genres:['Children\'s'], books:13, website:'', phone:'', domainOwned:'', domainExpiry:'', team:'', salesTeam:'', webDesigner:'', videoEditor:'' }
  ];
  var seedBooks = [
    { title:'Ali\'s Big Adventure', author:'Roxie Fiste', date:'Jan 30, 2024', series:'Ali\'s Adventures', genres:['Children\'s'], isbn:'' },
    { title:'Ali And The Ganderwat: Ali Adventures, Book #2', author:'Roxie Fiste', date:'Apr 08, 2025', series:'Ali\'s Adventures', genres:['Christian Fiction','Fantasy','Children\'s'], isbn:'' }
  ];

  var authors = JSON.parse(localStorage.getItem('authordb_authors') || 'null') || seedAuthors;
  var books = JSON.parse(localStorage.getItem('authordb_books') || 'null') || seedBooks;
  var editingBookIndex = null;
  var editingAuthorIndex = null;
  var bookFilterAuthor = null;

  function persist(){
    try {
      localStorage.setItem('authordb_authors', JSON.stringify(authors));
      localStorage.setItem('authordb_books', JSON.stringify(books));
    } catch(e) { /* storage unavailable — state still holds for this session */ }
  }

  function renderAuthors(filter){
    var el = document.getElementById('authorsPanel');
    var f = (filter||'').toLowerCase();
    var list = authors.filter(function(a){
      return !f || a.name.toLowerCase().indexOf(f) > -1 ||
        a.genres.some(function(g){ return g.toLowerCase().indexOf(f) > -1; });
    });
    if (!list.length) { el.innerHTML = '<div class="empty">No authors match that search.</div>'; return; }
    el.innerHTML = list.map(function(a){
      var teamBits = [];
      if (a.team) teamBits.push('Marketing: ' + esc(a.team));
      if (a.salesTeam) teamBits.push('Sales: ' + esc(a.salesTeam));
      if (a.webDesigner) teamBits.push('Web design: ' + esc(a.webDesigner));
      if (a.videoEditor) teamBits.push('Video: ' + esc(a.videoEditor));
      var authorBooks = books.filter(function(b){ return b.author.toLowerCase() === a.name.toLowerCase(); });
      var bookItems = authorBooks.map(function(b){
        return '<li><button class="book-link" data-book-idx="' + books.indexOf(b) + '">' + esc(b.title) + '</button></li>';
      }).join('');
      return '<div class="row">' +
        '<div class="avatar" style="background:' + colorFor(a.name) + '">' + esc(initials(a.name)) + '</div>' +
        '<div class="info">' +
          '<div class="name-line"><button class="name-link" data-goto="' + esc(a.name) + '"><span class="name">' + esc(a.name) + '</span></button><span class="badge" title="Verified">✔</span></div>' +
          '<div class="meta">' + esc(a.location) + ' &middot; <span class="count">' + a.books + ' Book' + (a.books===1?'':'s') + '</span></div>' +
          (a.phone ? '<div class="meta">Phone: <a href="tel:' + esc(a.phone.replace(/[^+\d]/g, '')) + '">' + esc(a.phone) + '</a></div>' : '') +
          (a.website ? '<div class="meta">Website: <a href="' + esc(a.website) + '" target="_blank" rel="noopener">' + esc(a.website.replace(/^https?:\/\//, '').replace(/\/$/, '')) + '</a></div>' : '') +
          (a.website || a.domainOwned || a.domainExpiry ? domainLine(a) : '') +
          (teamBits.length ? '<div class="meta">' + teamBits.join(' &middot; ') + '</div>' : '') +
          '<div class="tags">' + a.genres.map(function(g){ return '<span class="tag">'+esc(g)+'</span>'; }).join('') + '</div>' +
          (bookItems ? '<ul class="book-list">' + bookItems + '</ul>' : '') +
        '</div>' +
        '<div class="side">' +
          '<button class="add-book-btn" data-author="' + esc(a.name) + '">+ Add book</button>' +
          '<button class="edit-btn" data-idx="' + authors.indexOf(a) + '">Edit</button>' +
        '</div>' +
      '</div>';
    }).join('');
    el.querySelectorAll('.book-link').forEach(function(btn){
      btn.addEventListener('click', function(){
        goToBook(parseInt(btn.getAttribute('data-book-idx'), 10));
      });
    });
    el.querySelectorAll('.name-link').forEach(function(btn){
      btn.addEventListener('click', function(){
        goToBooksFor(btn.getAttribute('data-goto'));
      });
    });
    el.querySelectorAll('.edit-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        startEditAuthor(parseInt(btn.getAttribute('data-idx'), 10));
      });
    });
    el.querySelectorAll('.add-book-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        var authorName = btn.getAttribute('data-author');
        document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
        document.querySelectorAll('.panel').forEach(function(p){ p.classList.remove('active'); });
        document.querySelector('.tab[data-tab="books"]').classList.add('active');
        document.getElementById('booksPanel').classList.add('active');
        editingBookIndex = null;
        bookFilterAuthor = authorName;
        renderBooks();
        fillBookForm(null);
        document.getElementById('bookFormTitle').textContent = 'Add a book';
        document.getElementById('bf-save').textContent = 'Save book';
        document.getElementById('bf-author').value = authorName;
        document.getElementById('bookForm').classList.add('open');
        document.getElementById('bf-title').focus();
      });
    });
  }

  function goToBooksFor(name){
    bookFilterAuthor = name;
    document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
    document.querySelectorAll('.panel').forEach(function(p){ p.classList.remove('active'); });
    document.querySelector('.tab[data-tab="books"]').classList.add('active');
    document.getElementById('booksPanel').classList.add('active');
    renderBooks();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function goToBook(idx){
    bookFilterAuthor = null;
    document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
    document.querySelectorAll('.panel').forEach(function(p){ p.classList.remove('active'); });
    document.querySelector('.tab[data-tab="books"]').classList.add('active');
    document.getElementById('booksPanel').classList.add('active');
    renderBooks();
    var target = document.getElementById('book-row-' + idx);
    if (target) {
      target.scrollIntoView({ behavior: 'smooth', block: 'center' });
      target.classList.add('highlight');
      setTimeout(function(){ target.classList.remove('highlight'); }, 1800);
    }
  }

  function fillAuthorForm(a){
    document.getElementById('af-name').value = a ? a.name : '';
    document.getElementById('af-location').value = a ? a.location : '';
    document.getElementById('af-genres').value = a ? a.genres.join(', ') : '';
    document.getElementById('af-website').value = a ? (a.website || '') : '';
    document.getElementById('af-phone').value = a ? (a.phone || '') : '';
    document.getElementById('af-domainowned').value = a ? (a.domainOwned || '') : '';
    document.getElementById('af-domainexpiry').value = a ? (a.domainExpiry || '') : '';
    document.getElementById('af-team').value = a ? (a.team || '') : '';
    document.getElementById('af-salesteam').value = a ? (a.salesTeam || '') : '';
    document.getElementById('af-webdesigner').value = a ? (a.webDesigner || '') : '';
    document.getElementById('af-videoeditor').value = a ? (a.videoEditor || '') : '';
  }

  function startEditAuthor(idx){
    editingAuthorIndex = idx;
    fillAuthorForm(authors[idx]);
    document.getElementById('authorFormTitle').textContent = 'Edit author';
    document.getElementById('af-save').textContent = 'Update author';
    document.getElementById('authorForm').classList.add('open');
    document.getElementById('af-name').scrollIntoView({ block: 'center', behavior: 'smooth' });
  }

  function resetAuthorForm(){
    editingAuthorIndex = null;
    fillAuthorForm(null);
    document.getElementById('authorFormTitle').textContent = 'Add an author';
    document.getElementById('af-save').textContent = 'Save author';
    document.getElementById('authorForm').classList.remove('open');
  }

  function fillBookForm(b){
    document.getElementById('bf-title').value = b ? b.title : '';
    document.getElementById('bf-author').value = b ? b.author : '';
    document.getElementById('bf-date').value = b ? b.date : '';
    document.getElementById('bf-series').value = b ? (b.series || '') : '';
    document.getElementById('bf-genres').value = b ? b.genres.join(', ') : '';
    document.getElementById('bf-isbn').value = b ? (b.isbn || '') : '';
  }

  function startEditBook(idx){
    editingBookIndex = idx;
    fillBookForm(books[idx]);
    document.getElementById('bookFormTitle').textContent = 'Edit book';
    document.getElementById('bf-save').textContent = 'Update book';
    document.getElementById('bookForm').classList.add('open');
    document.getElementById('bf-title').scrollIntoView({ block: 'center', behavior: 'smooth' });
  }

  function resetBookForm(){
    editingBookIndex = null;
    fillBookForm(null);
    document.getElementById('bookFormTitle').textContent = 'Add a book';
    document.getElementById('bf-save').textContent = 'Save book';
    document.getElementById('bookForm').classList.remove('open');
  }

  function renderBooks(){
    var el = document.getElementById('booksList');
    var bar = document.getElementById('bookFilterBar');
    var list = bookFilterAuthor
      ? books.filter(function(b){ return b.author.toLowerCase() === bookFilterAuthor.toLowerCase(); })
      : books;
    if (bookFilterAuthor) {
      bar.innerHTML = '<div class="filter-bar"><span>Showing books by <strong>' + esc(bookFilterAuthor) + '</strong></span><button id="clearBookFilter">Show all books</button></div>';
      document.getElementById('clearBookFilter').addEventListener('click', function(){
        bookFilterAuthor = null;
        renderBooks();
      });
    } else {
      bar.innerHTML = '';
    }
    if (!list.length) {
      el.innerHTML = '<div class="empty">' + (bookFilterAuthor ? 'No books for this author yet.' : 'No books yet. Add one to get started.') + '</div>';
      return;
    }
    el.innerHTML = list.map(function(b){
      var authorObj = authors.find(function(a){ return a.name.toLowerCase() === b.author.toLowerCase(); });
      var authorBit = (authorObj && authorObj.website)
        ? '<a href="' + esc(authorObj.website) + '" target="_blank" rel="noopener">' + esc(b.author) + '</a>'
        : esc(b.author);
      var extra = [];
      if (b.isbn) extra.push('ISBN: ' + esc(b.isbn));
      return '<div class="row" id="book-row-' + books.indexOf(b) + '">' +
        '<div class="cover" style="background:' + colorFor(b.title) + '">' + esc(b.title.slice(0,18)) + '</div>' +
        '<div class="info">' +
          '<div class="name">' + esc(b.title) + '</div>' +
          '<div class="meta">by ' + authorBit + '</div>' +
          '<div class="meta">Publish: ' + esc(b.date) + (b.series ? ' &middot; Series: ' + esc(b.series) : '') + '</div>' +
          (extra.length ? '<div class="meta">' + extra.join(' &middot; ') + '</div>' : '') +
          '<div class="tags">' + b.genres.map(function(g){ return '<span class="tag">'+esc(g)+'</span>'; }).join('') + '</div>' +
        '</div>' +
        '<button class="edit-btn" data-idx="' + books.indexOf(b) + '">Edit</button>' +
      '</div>';
    }).join('');
    el.querySelectorAll('.edit-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        startEditBook(parseInt(btn.getAttribute('data-idx'), 10));
      });
    });
  }

  document.querySelectorAll('.tab').forEach(function(tab){
    tab.addEventListener('click', function(){
      document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
      document.querySelectorAll('.panel').forEach(function(p){ p.classList.remove('active'); });
      tab.classList.add('active');
      document.getElementById(tab.getAttribute('data-tab') + 'Panel').classList.add('active');
      if (tab.getAttribute('data-tab') === 'books') { bookFilterAuthor = null; renderBooks(); }
    });
  });

  document.getElementById('authorSearch').addEventListener('input', function(){ renderAuthors(this.value); });

  document.getElementById('authorAddToggle').addEventListener('click', function(){
    var form = document.getElementById('authorForm');
    if (form.classList.contains('open') && editingAuthorIndex === null) {
      resetAuthorForm();
    } else {
      editingAuthorIndex = null;
      fillAuthorForm(null);
      document.getElementById('authorFormTitle').textContent = 'Add an author';
      document.getElementById('af-save').textContent = 'Save author';
      form.classList.add('open');
    }
  });
  document.getElementById('af-cancel').addEventListener('click', function(){
    resetAuthorForm();
  });
  document.getElementById('af-save').addEventListener('click', function(){
    var name = document.getElementById('af-name').value.trim();
    if (!name) return;
    var location = document.getElementById('af-location').value.trim() || 'Unknown';
    var genres = document.getElementById('af-genres').value.split(',').map(function(s){return s.trim();}).filter(Boolean);
    var website = document.getElementById('af-website').value.trim();
    var phone = document.getElementById('af-phone').value.trim();
    var domainOwned = document.getElementById('af-domainowned').value;
    var domainExpiry = document.getElementById('af-domainexpiry').value;
    var team = document.getElementById('af-team').value.trim();
    var salesTeam = document.getElementById('af-salesteam').value.trim();
    var webDesigner = document.getElementById('af-webdesigner').value.trim();
    var videoEditor = document.getElementById('af-videoeditor').value.trim();
    if (editingAuthorIndex !== null) {
      var existing = authors[editingAuthorIndex];
      var oldName = existing.name;
      existing.name = name;
      existing.location = location;
      existing.genres = genres.length ? genres : ['General'];
      existing.website = website;
      existing.phone = phone;
      existing.domainOwned = domainOwned;
      existing.domainExpiry = domainExpiry;
      existing.team = team;
      existing.salesTeam = salesTeam;
      existing.webDesigner = webDesigner;
      existing.videoEditor = videoEditor;
      if (oldName.toLowerCase() !== name.toLowerCase()) {
        books.forEach(function(b){ if (b.author.toLowerCase() === oldName.toLowerCase()) b.author = name; });
      }
    } else {
      authors.push({ name:name, location:location, genres: genres.length?genres:['General'], books:0, website:website, phone:phone, domainOwned:domainOwned, domainExpiry:domainExpiry, team:team, salesTeam:salesTeam, webDesigner:webDesigner, videoEditor:videoEditor });
    }
    persist();
    resetAuthorForm();
    renderAuthors(document.getElementById('authorSearch').value);
    renderBooks();
  });

  document.getElementById('bookAddToggle').addEventListener('click', function(){
    var form = document.getElementById('bookForm');
    if (form.classList.contains('open') && editingBookIndex === null) {
      resetBookForm();
    } else {
      editingBookIndex = null;
      fillBookForm(null);
      document.getElementById('bookFormTitle').textContent = 'Add a book';
      document.getElementById('bf-save').textContent = 'Save book';
      form.classList.add('open');
    }
  });
  document.getElementById('bf-cancel').addEventListener('click', function(){
    resetBookForm();
  });
  document.getElementById('bf-save').addEventListener('click', function(){
    var title = document.getElementById('bf-title').value.trim();
    var author = document.getElementById('bf-author').value.trim();
    if (!title || !author) return;
    var date = document.getElementById('bf-date').value.trim() || 'Unpublished';
    var series = document.getElementById('bf-series').value.trim();
    var genres = document.getElementById('bf-genres').value.split(',').map(function(s){return s.trim();}).filter(Boolean);
    var isbn = document.getElementById('bf-isbn').value.trim();
    var record = { title:title, author:author, date:date, series:series, genres: genres.length?genres:['General'], isbn:isbn };

    if (editingBookIndex !== null) {
      var oldAuthor = books[editingBookIndex].author;
      books[editingBookIndex] = record;
      if (oldAuthor.toLowerCase() !== author.toLowerCase()) {
        var oldA = authors.find(function(a){ return a.name.toLowerCase() === oldAuthor.toLowerCase(); });
        if (oldA && oldA.books > 0) oldA.books -= 1;
        var newA = authors.find(function(a){ return a.name.toLowerCase() === author.toLowerCase(); });
        if (newA) newA.books += 1;
      }
    } else {
      books.push(record);
      var existing = authors.find(function(a){ return a.name.toLowerCase() === author.toLowerCase(); });
      if (existing) existing.books += 1;
    }
    persist();
    resetBookForm();
    renderBooks();
    renderAuthors(document.getElementById('authorSearch').value);
  });


  /* ---------- CSV export ---------- */
  var downloadsApi = null;
  if (window.claude && typeof window.claude.use === 'function') {
    window.claude.use('downloads').then(function(d){
      downloadsApi = d;
      if (d) document.querySelectorAll('.export-btn').forEach(function(b){ b.hidden = false; });
    }).catch(function(){});
  }

  function csvCell(v){
    var s = v == null ? '' : String(v);
    if (/^[=@\t\r]/.test(s) || (/^[+\-]/.test(s) && /[A-Za-z]/.test(s))) s = "'" + s;
    return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function toCsv(header, rows){
    return '\uFEFF' + [header].concat(rows).map(function(r){ return r.map(csvCell).join(','); }).join('\r\n');
  }
  function todayStamp(){
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function showNote(msg){
    var n = document.getElementById('exportNote');
    n.textContent = msg;
    if (msg) setTimeout(function(){ if (n.textContent === msg) n.textContent = ''; }, 4000);
  }
  function exportCsv(filename, data, label){
    if (!downloadsApi) return;
    downloadsApi.save({ filename: filename, data: data }).then(function(){
      showNote(label + ' exported.');
    }).catch(function(err){
      if (err && err.code === 'declined') return;
      showNote(err && err.code === 'rate_limited' ? 'Please wait a moment and try again.' : 'Export is not available right now.');
    });
  }

  document.getElementById('exportAuthors').addEventListener('click', function(){
    var header = ['Name','Location','Genres','Books','Book titles','Website','Phone','Domain owned','Domain expiry','Marketing team','Sales team','Web designer','Video editor'];
    var rows = authors.map(function(a){
      var titles = books.filter(function(b){ return b.author.toLowerCase() === a.name.toLowerCase(); }).map(function(b){ return b.title; });
      return [a.name, a.location, a.genres.join('; '), a.books, titles.join('; '), a.website || '', a.phone || '', a.domainOwned || '', a.domainExpiry || '', a.team || '', a.salesTeam || '', a.webDesigner || '', a.videoEditor || ''];
    });
    exportCsv('authors-' + todayStamp() + '.csv', toCsv(header, rows), 'Authors list');
  });

  document.getElementById('exportBooks').addEventListener('click', function(){
    var header = ['Title','Author','Publish date','Series','Genres','ISBN'];
    var rows = books.map(function(b){
      return [b.title, b.author, b.date, b.series || '', b.genres.join('; '), b.isbn || ''];
    });
    exportCsv('books-' + todayStamp() + '.csv', toCsv(header, rows), 'Books list');
  });

  renderAuthors('');
  renderBooks();
})();
</script>
</body>
</html>
